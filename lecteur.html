<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAF International — Documents compagnie</title>
<style>
:root{--navy:#14304f;--ink:#1d2733;--muted:#5d6b7c;--line:#dfe5ec;--bg:#f4f6f9;--card:#fff;--acc:#d8452b;--fr:#3d5a7a;--hl:#fff2b3;--th:#eef3f8;
  --toc-w:300px;font-size:16px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#9cc3ec;--ink:#e3e8ee;--muted:#9aa7b6;--line:#2c3744;--bg:#10161d;--card:#18212b;--fr:#a9c4e2;--hl:#5a4b10;--th:#1f2b38;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
/* barre supérieure */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));
  background:var(--card);border-bottom:1px solid var(--line)}
.top .logo{height:34px;width:auto;background:#fff;border-radius:4px;padding:2px 4px}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;color:var(--navy);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer;min-height:36px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 11px;font:inherit;font-size:13px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--card);font-weight:600}
#menu{display:none}
/* mise en page */
.layout{display:grid;grid-template-columns:var(--toc-w) minmax(0,1fr);max-width:1280px;margin:0 auto}
nav.toc{position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto;padding:16px 10px 40px 14px;border-right:1px solid var(--line);font-size:13.5px}
.toc .search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;margin-bottom:10px}
.toc a{display:block;color:var(--ink);text-decoration:none;padding:4px 8px;border-radius:6px}
.toc a:hover{background:var(--th)}
.toc a.h1{font-weight:600;color:var(--navy);margin-top:8px}
.toc a.h2{padding-left:20px;color:var(--muted)}
.toc a.on{background:var(--th);color:var(--navy)}
.toc .hits{font-size:12px;color:var(--muted);margin:-4px 0 8px 2px}
main{padding:24px clamp(14px,4vw,48px) 80px;max-width:900px;width:100%}
.note{border-left:3px solid var(--acc);background:var(--card);padding:10px 14px;font-size:13px;color:var(--muted);border-radius:0 8px 8px 0;margin-bottom:22px}
.note a{color:var(--navy)}
h1,h2,h3,h4{color:var(--navy);line-height:1.3;scroll-margin-top:76px}
h1.ch{font-size:clamp(22px,4vw,28px);margin:48px 0 12px;padding-top:18px;border-top:2px solid var(--navy)}
h2{font-size:20px;margin:34px 0 10px}
h3{font-size:17px;margin:26px 0 8px}
h4{font-size:15.5px;margin:20px 0 6px}
.num{color:var(--acc);margin-right:.4em;font-variant-numeric:tabular-nums}
.refs{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}
.sub{font-weight:600;margin:16px 0 4px}
p{margin:8px 0}
ul,ol{margin:6px 0 10px;padding-left:1.4em}
li{margin:3px 0}
.fr{color:var(--fr);font-style:italic}
.fr-only .en-t{display:none}.en-only .fr-t{display:none}
body.both .fr-t{display:block;font-size:.93em;margin-top:2px}
body.both h1 .fr-t,body.both h2 .fr-t,body.both h3 .fr-t,body.both h4 .fr-t{font-size:.72em;font-weight:500}
.miss{font-size:10.5px;font-style:normal;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--muted);vertical-align:middle}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
td,th{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left;white-space:pre-line}
tr:first-child td{background:var(--th);font-weight:600}
td:last-child{border-right:0}tr:last-child td{border-bottom:0}
td img{max-width:100%}
figure{margin:14px 0;text-align:center}
figure img{max-width:100%;height:auto;border-radius:6px;background:#fff;cursor:zoom-in}
mark{background:var(--hl);color:inherit}
footer{margin-top:50px;font-size:12px;color:var(--muted);word-break:break-all}
.zoom{position:fixed;inset:0;background:#000d;z-index:50;display:none;align-items:center;justify-content:center;padding:12px}
.zoom img{max-width:100%;max-height:100%;background:#fff}
.zoom.on{display:flex}
.scrim{display:none}
@media (max-width:860px){
  #menu{display:inline-block}
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.toc{position:fixed;top:0;left:0;bottom:0;width:min(86vw,340px);height:auto;z-index:40;background:var(--card);
    transform:translateX(-105%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px));box-shadow:0 0 30px #0004}
  body.toc-open nav.toc{transform:none}
  body.toc-open .scrim{display:block;position:fixed;inset:0;background:#0006;z-index:35}
  .top .ttl span{display:none}
  .top .logo{height:28px}
  table{font-size:13px}
}
@media (max-width:420px){.seg button{padding:7px 8px}}
@media print{.top,nav.toc,.note .btn{display:none}.layout{display:block}main{max-width:none}}
</style>
</head>

kDAn8kAAAAASUVORK5CYII=">
  <div class="ttl"><b id="t-title">…</b><span id="t-meta"></span></div>
  <div class="seg" role="group" aria-label="Langue">
    <button data-v="en">EN</button><button data-v="fr">FR</button><button data-v="both">EN+FR</button>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="layout">
  <nav class="toc" id="toc" aria-label="Sommaire">
    <input class="search" id="q" type="search" placeholder="Rechercher dans le document">
    <div class="hits" id="hits"></div>
    <div id="toc-links"></div>
  </nav>
  <main id="main"></main>
</div>
<div class="zoom" id="zoom"><img alt=""></div>
<script>
const DOC = /*DOC_JSON*/null;
const IMG = /*IMG_JSON*/null;
(async function () {
  const params = new URLSearchParams(location.search);
  let doc = DOC, base = "";
  if (!doc) {
    const url = params.get("doc");
    if (!url) { document.getElementById("main").textContent = "Aucun document indiqué (?doc=…/doc.json)."; return; }
    base = url.split("?")[0].replace(/[^/]*$/, "");
    try { const r = await fetch(url); if (!r.ok) throw new Error("HTTP " + r.status); doc = await r.json(); }
    catch (e) { document.getElementById("main").textContent = "Document indisponible (" + e.message + "). Fermez et rouvrez-le depuis le portail."; return; }
  }
  const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const src = n => /^data:/.test(n) ? n : (IMG && IMG[n]) || base + "images/" + n;
  const FR = doc.fr || {};
  const hasFr = k => k && FR[k];
  // texte bilingue : <span class="en-t"> + <span class="fr-t">
  const bi = (en, k, block) => {
    const fr = k && FR[k] !== en && FR[k], tag = block ? "div" : "span";
    if (!en) return "";
    return `<${tag} class="en-t" lang="en">${esc(en)}${fr ? "" : '<span class="miss fr-only-flag">EN</span>'}</${tag}>` +
           (fr ? `<${tag} class="fr-t fr" lang="fr">${esc(fr)}</${tag}>` : "");
  };
  document.getElementById("t-title").textContent = `${doc.code} — ${doc.title}`;
  document.getElementById("t-meta").textContent = doc.issue || "";
  document.title = `${doc.code} — ${doc.title}`;
  const units = new Set(); doc.segments.forEach(s => { if (s.k) units.add(s.k); (s.rows || []).forEach(r => r.forEach(c => c.k && units.add(c.k))); });
  const done = [...units].filter(k => FR[k]).length, pct = Math.round(100 * done / Math.max(1, units.size));

  const out = [], toc = [];
  out.push(`<div class="note"><b>Copie de lecture</b>${doc.issue ? " — " + esc(doc.issue) : ""}. Le document de référence reste la version approuvée de la compagnie.
    La version française est une traduction de travail, non opposable (FR : ${pct} %).${doc.pdf ? ` <a href="${esc(doc.pdf)}">PDF officiel</a>` : ""}</div>`);
  let list = [];               // pile de listes ouvertes
  const closeLists = (to = -1) => { while (list.length > to + 1) out.push(list.pop() === "ol" ? "</ol>" : "</ul>"); };
  for (const s of doc.segments) {
    if (s.type !== "li") closeLists();
    if (/^h[1-4]$/.test(s.type)) {
      const lv = +s.type[1], tag = lv === 1 ? "h1" : "h" + Math.min(4, lv);
      const label = (s.num ? `<span class="num">${esc(s.num)}</span>` : "");
      out.push(`<${tag} id="${s.id}"${lv === 1 ? ' class="ch"' : ""}>${label}${bi(s.en, s.k)}${s.refs ? `<span class="refs">${esc(s.refs)}</span>` : ""}</${tag}>`);
      if (lv <= 2) toc.push(`<a class="h${lv}" href="#${s.id}" data-id="${s.id}">${s.num ? esc(s.num) + " " : ""}${esc(s.en)}${FR[s.k] ? `<span class="fr-t fr" style="display:block;font-size:.9em">${esc(FR[s.k])}</span>` : ""}</a>`);
    } else if (s.type === "li") {
      const kind = s.ol ? "ol" : "ul";
      while (list.length > s.lvl + 1) out.push(list.pop() === "ol" ? "</ol>" : "</ul>");
      while (list.length < s.lvl + 1) { list.push(kind); out.push(kind === "ol" ? `<ol>` : "<ul>"); }
      out.push(`<li id="${s.id}"${s.ol ? ` value="${s.ol}"` : ""}>${bi(s.en, s.k, true)}</li>`);
    } else if (s.type === "sub") out.push(`<div class="sub" id="${s.id}">${bi(s.en, s.k, true)}</div>`);
    else if (s.type === "p") out.push(`<p id="${s.id}">${bi(s.en, s.k, true)}</p>`);
    else if (s.type === "img") out.push(`<figure id="${s.id}"><img loading="lazy" alt="" src="${src(s.src)}"></figure>`);
    else if (s.type === "table") {
      out.push(`<div class="tw" id="${s.id}"><table>` + s.rows.map(r => "<tr>" + r.map(c =>
        `<td${c.cs ? ` colspan="${c.cs}"` : ""}${c.rs ? ` rowspan="${c.rs}"` : ""}>${bi(c.en, c.k, true)}${(c.img || []).map(i => `<img loading="lazy" alt="" src="${src(i)}">`).join("")}</td>`).join("") + "</tr>").join("") + "</table></div>");
    }
  }
  closeLists();
  out.push(`<footer>Sources : ${doc.sources.map(esc).join(" · ")}<br>Empreinte SHA-256 des exports Word : ${doc.sha256}</footer>`);
  const main = document.getElementById("main"); main.innerHTML = out.join("\n");
  document.getElementById("toc-links").innerHTML = toc.join("");

  // langue
  const setView = v => {
    document.body.classList.remove("en-only", "fr-only", "both");
    document.body.classList.add(v === "en" ? "en-only" : v === "fr" ? "fr-only" : "both");
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
    try { localStorage.setItem("saf-doc-lang", v); } catch (e) {}
  };
  // en mode FR : un paragraphe sans traduction reste affiché en anglais (badge EN)
  const st = document.createElement("style");
  st.textContent = `.fr-only .en-t{display:none}.fr-only .en-t:has(.fr-only-flag){display:revert}.fr-only-flag{display:none}.fr-only .fr-only-flag{display:inline}`;
  document.head.appendChild(st);
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setView(b.dataset.v));
  let saved = "both"; try { saved = localStorage.getItem("saf-doc-lang") || "both"; } catch (e) {}
  setView(saved);

  // sommaire mobile
  const body = document.body;
  document.getElementById("menu").onclick = () => body.classList.add("toc-open");
  document.getElementById("scrim").onclick = () => body.classList.remove("toc-open");
  document.getElementById("toc-links").addEventListener("click", e => { if (e.target.closest("a")) body.classList.remove("toc-open"); });

  // section courante
  const links = {}; document.querySelectorAll(".toc a").forEach(a => links[a.dataset.id] = a);
  let cur = null;
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting && links[e.target.id]) { cur && cur.classList.remove("on"); cur = links[e.target.id]; cur.classList.add("on"); }
  }), { rootMargin: "-70px 0px -75% 0px" });
  document.querySelectorAll("main h1, main h2").forEach(h => io.observe(h));

  // recherche (EN et FR)
  const q = document.getElementById("q"), hits = document.getElementById("hits");
  let marks = [], idx = -1;
  const clear = () => { marks.forEach(m => m.replaceWith(document.createTextNode(m.textContent))); main.normalize(); marks = []; idx = -1; hits.textContent = ""; };
  const run = () => {
    clear(); const term = q.value.trim(); if (term.length < 2) return;
    const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT); const nodes = [];
    while (walker.nextNode()) if (re.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      const frag = document.createDocumentFragment(); let last = 0; const t = n.nodeValue; re.lastIndex = 0; let m;
      while ((m = re.exec(t))) { frag.append(t.slice(last, m.index)); const mk = document.createElement("mark"); mk.textContent = m[0]; frag.append(mk); marks.push(mk); last = m.index + m[0].length; }
      frag.append(t.slice(last)); n.replaceWith(frag);
    });
    hits.textContent = marks.length ? `${marks.length} résultat(s) — Entrée pour le suivant` : "Aucun résultat";
  };
  let tmr; q.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(run, 250); });
  q.addEventListener("keydown", e => {
    if (e.key === "Enter" && marks.length) {
      const vis = marks.filter(m => m.offsetParent); if (!vis.length) return;
      idx = (idx + 1) % vis.length; vis[idx].scrollIntoView({ block: "center" }); body.classList.remove("toc-open");
    }
  });

  // zoom images
  const zoom = document.getElementById("zoom");
  main.addEventListener("click", e => { if (e.target.tagName === "IMG") { zoom.firstElementChild.src = e.target.src; zoom.classList.add("on"); } });
  zoom.onclick = () => zoom.classList.remove("on");
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
})();
</script>
</body>
