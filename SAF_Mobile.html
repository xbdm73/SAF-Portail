<style>
:root{
  --sky:#e6f0f9; --paper:#ffffff; --ink:#0a2238; --ink2:#34506b; --line:#bfd2e4; --band:#0b2a4a;
  --gold:#c99a1f; --report:#c42b1c; --docs:#1d5096; --tst:#1d7a4c; --pv:#5a4a8c; --warn:#8a5a00; --err:#b42318;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--docs)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hide{display:none!important}

/* ── Bandeau ── */
#band{position:sticky;top:0;z-index:20;background:var(--band);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
#band img{height:30px;width:auto;display:block}
#band .where{font-family:var(--cond);font-weight:600;font-size:20px;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:4px 8px 4px 0;cursor:pointer;min-height:40px}
.langs{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden;flex-shrink:0}
.langs button{background:none;border:0;color:#cfe0f2;font-size:13px;font-weight:600;padding:7px 8px;cursor:pointer;min-width:34px}
.langs button.on{background:#fff;color:var(--band)}

main{max-width:680px;margin:0 auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
h1{font-family:var(--cond);font-weight:700;font-size:34px;line-height:1.05;margin:6px 0 4px}
h2{font-family:var(--cond);font-weight:700;font-size:23px;margin:26px 0 10px}
p.lead{color:var(--ink2);margin:0 0 18px}

/* ── Accueil : liste groupée des modules ── */
.modules{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mod{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:20px 16px 20px 0;cursor:pointer;min-height:104px;position:relative}
.mod:first-child{border-top:0}
.mod::before{content:"";align-self:stretch;width:7px;background:var(--c);border-radius:0 4px 4px 0}
.mod .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);flex-shrink:0}
.mod .ic svg{width:26px;height:26px}
.mod .tx{flex:1;min-width:0}
.mod strong{display:block;font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.05}
.mod small{display:block;color:var(--ink2);font-size:15px;margin-top:4px}
.mod .chev{color:var(--ink2);font-size:28px;padding-right:2px}
.mod:active{background:#f1f6fb}
.badge{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px;margin-top:7px}
.badge.q{background:#fff2d6;color:var(--warn);border:1px solid #f0d08a}
.badge.ok{background:#dff3e8;color:var(--tst);border:1px solid #9fd4b6}
.foot{color:var(--ink2);font-size:13px;margin-top:22px}


/* ── Accueil : vue planètes (comme le portail SAF) ── */
body:has(#v-home:not(.hide)){background:#02040b}
#v-home.space{position:relative;max-width:none;min-height:calc(100dvh - 58px - env(safe-area-inset-top,0px));padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 16px);overflow:hidden;color:#eef5ff;
  background:radial-gradient(ellipse at 12% 78%,#183b7233,transparent 58%),radial-gradient(ellipse at 85% 15%,#382b6933,transparent 55%),#02040b;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#v-home .stars{position:absolute;inset:0;pointer-events:none;opacity:.85;
  background-image:radial-gradient(1.5px 1.5px at 15% 25%,#c8e1ff,transparent),radial-gradient(1px 1px at 65% 80%,#fff,transparent),radial-gradient(1px 1px at 85% 12%,#c4b6ff,transparent),radial-gradient(1.2px 1.2px at 40% 55%,#fff,transparent);
  background-size:213px 191px,97px 153px,173px 127px,131px 239px;animation:twinkle 7s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.45}}
.orbit{--o:min(82vw,580px,calc(100dvh - 200px));--psz:calc(var(--o)*.21);--R:calc(var(--o)*.36);position:relative;width:var(--o);height:var(--o);margin:8px auto 0;flex-shrink:0;animation:enter .8s ease-out both}
@keyframes enter{from{opacity:0;transform:scale(.92)}}
.orbit .ring{position:absolute;inset:calc(50% - var(--R));border-radius:50%;border:1px solid #eef5ff22;box-shadow:0 0 0 1px #eef5ff08 inset}
.sun{position:absolute;inset:34%;border-radius:50%;display:grid;place-items:center;isolation:isolate;z-index:1;
  background:radial-gradient(circle,#fff 0%,#fff4cb 48%,#fbc36b 83%,#ee8d32 100%);box-shadow:0 0 22px 6px #ffb34388,0 0 65px 20px #ff8a283d;animation:glow 5s ease-in-out infinite}
.sun::before{content:"";position:absolute;inset:-70%;z-index:-2;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,#ffd388bb 0deg,#ff8b3c55 2deg,transparent 7deg 12deg,#ffb14c99 15deg,transparent 21deg 28deg);
  -webkit-mask-image:radial-gradient(circle,transparent 18%,#000 26%,#000a 32%,transparent 60%);mask-image:radial-gradient(circle,transparent 18%,#000 26%,#000a 32%,transparent 60%);animation:spin 60s linear infinite}
.sun::after{content:"";position:absolute;inset:-45%;z-index:-1;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff4acbb 15%,#ffb64c88 26%,#ff772b33 42%,transparent 66%)}
.sun img{width:80%;height:auto;position:relative;z-index:1;filter:drop-shadow(0 1px 2px #0004)}
@keyframes glow{50%{box-shadow:0 0 32px 10px #ffb34399,0 0 85px 25px #ff8a284d}}
@keyframes spin{to{transform:rotate(360deg)}}
.carousel{position:absolute;inset:0;animation:spin 120s linear infinite;z-index:2}
.slot{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateX(var(--R)) rotate(calc(0deg - var(--a)))}
.counter{position:absolute;left:0;top:0;width:0;height:0;animation:spin 120s linear infinite reverse}
.pl{position:absolute;left:calc(var(--psz)/-2);top:calc(var(--psz)/-2);width:var(--psz);height:var(--psz);padding:0;border:0;background:none;cursor:pointer;color:#eef5ff;-webkit-tap-highlight-color:transparent}
.pl .ball{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;color:#fff;
  background:radial-gradient(circle at 35% 30%,#fff9,transparent 32%),radial-gradient(circle at 35% 30%,var(--c) 13%,color-mix(in srgb,var(--c) 65%,#000) 55%,#070d18 100%);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent),0 0 28px -4px color-mix(in srgb,var(--c) 85%,transparent);transition:transform .2s ease}
.pl .ball svg{width:44%;height:44%;filter:drop-shadow(0 1px 1px #0006)}
.pl:active .ball,.pl:focus-visible .ball{transform:scale(1.12)}
.pl .nm{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);width:max-content;max-width:calc(var(--psz)*1.95);text-align:center;line-height:1.1}
.pl .nm b{display:inline-block;font-family:var(--cond);font-weight:700;font-size:clamp(13px,calc(var(--o)*.037),17px);padding:3px 9px;border-radius:999px;background:#101a29d9;border:1px solid color-mix(in srgb,var(--c) 45%,#273a51)}
.pl .nm .badge{display:block;margin:4px auto 0;width:max-content;font-size:11.5px;padding:1px 8px}
.orbit:has(.pl:active) .carousel,.orbit:has(.pl:active) .counter,.orbit:focus-within .carousel,.orbit:focus-within .counter{animation-play-state:paused}
.orbit-hint{position:relative;margin:calc(var(--psz,60px)*.2 + 26px) 0 0;color:#a7b7ca;font-size:14px;text-align:center}
#v-home .foot{position:relative;color:#6f8399;margin-top:10px}
.flight{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.ship{position:absolute;left:-180px;top:14%;width:120px;aspect-ratio:260/112;animation:fly 60s linear 6s infinite;filter:drop-shadow(0 0 8px #72cfff) drop-shadow(0 0 16px #398aff80)}
.ship svg{width:100%;height:100%;overflow:visible}
.v8-exhaust{animation:engine .45s ease-in-out infinite alternate;transform-origin:right center}
@keyframes engine{to{opacity:.55}}
@keyframes fly{0%{left:-180px;top:14%;opacity:1;transform:rotate(8deg)}16%{left:calc(100% + 180px);top:30%;opacity:1;transform:rotate(8deg)}17%,49%{left:calc(100% + 180px);top:30%;opacity:0}50%{left:calc(100% + 180px);top:80%;opacity:1;transform:scaleX(-1) rotate(9deg)}66%{left:-180px;top:64%;opacity:1;transform:scaleX(-1) rotate(9deg)}67%,100%{left:-180px;top:64%;opacity:0}}
@media (prefers-reduced-motion:reduce){.carousel,.counter,.sun,.sun::before,#v-home .stars,.orbit{animation:none!important}.flight{display:none}}

/* ── Éléments de formulaire ── */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.f{margin:0 0 14px}
.f:last-child{margin-bottom:0}
.f label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.f .opt{font-weight:400;color:var(--ink2)}
input[type=text],input[type=email],input[type=search],input[inputmode=numeric]{width:100%;min-height:50px;border:1.5px solid #8fa9c2;border-radius:10px;background:#fff;padding:11px 13px;font-size:17px}
select{width:100%;min-height:50px;border:1.5px solid #8fa9c2;border-radius:10px;background:#fff;padding:11px 13px;font-size:17px;color:var(--ink)}
input:focus,select:focus{border-color:var(--docs)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.row2 .f,.row2 .f:last-child{margin-bottom:14px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:11px;border:1.5px solid #8fa9c2;background:#fff;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.main{background:var(--c,var(--docs));border-color:var(--c,var(--docs));color:#fff;width:100%;font-size:18px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{border:0;background:none;color:var(--docs);min-height:40px;padding:6px 0;text-decoration:underline}
.msg{font-size:15px;margin:10px 0 0}
.msg.err{color:var(--err)} .msg.ok{color:var(--tst)}
.note{font-size:14.5px;color:var(--ink2);margin:8px 0 0}
.sw{display:flex;align-items:center;gap:12px;min-height:54px;cursor:pointer}
.sw input{width:24px;height:24px;accent-color:var(--tst);flex-shrink:0}

/* ── Safety Report ── */
#v-report{max-width:none;padding:0}
#report-frame{display:block;width:100%;border:0;height:calc(100dvh - 58px - env(safe-area-inset-top,0px));background:#0D1B2A}
.report-alt{padding:10px 16px;font-size:14px;background:var(--paper);border-top:1px solid var(--line)}

/* ── Documentation ── */
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:15px;margin:4px 0 10px}
.crumbs button{background:none;border:0;color:var(--docs);padding:6px 2px;cursor:pointer;text-decoration:underline;font-weight:500}
.crumbs span{color:var(--ink2)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 14px;min-height:62px;cursor:pointer}
.li:first-child{border-top:0}
.li:active{background:#f1f6fb}
.li .k{width:42px;height:34px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;font-size:12px;font-weight:700}
.li .k.fd{background:#e4ecf6;color:var(--docs)}
.li .k.pdf{background:#fde8e6;color:var(--report)}
.li .k.htm{background:#e1f2e9;color:var(--tst)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.li .t small{display:block;color:var(--ink2);font-size:13.5px;margin-top:2px}
.li .n{color:var(--ink2);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.tag.must{background:#fff2d6;color:var(--warn)}
.tag.read{background:#dff3e8;color:var(--tst)}
.empty{padding:18px;color:var(--ink2);text-align:center}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,34,56,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--paper);width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px);max-height:88dvh;overflow:auto}
.sheet h3{font-family:var(--cond);font-size:25px;margin:0 0 4px;line-height:1.1}
.meta{color:var(--ink2);font-size:14.5px;margin:0 0 14px}
.stack{display:grid;gap:10px}

/* ── Briefing TST ── */
#v-tst{--c:var(--tst)}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who b{font-size:18px}
.prog{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog span{color:var(--ink2);font-size:15px}
.bar{height:8px;background:#d5e2ee;border-radius:9px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--tst);transition:width .15s}
.ck{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:13px 13px;margin:8px 0;cursor:pointer;min-height:58px}
.ck input{width:26px;height:26px;margin:0;flex-shrink:0;accent-color:var(--tst)}
.ck:has(input:checked){border-color:var(--tst);background:#eef8f2}
.ck .no{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600;min-width:1.6em}
.sig{position:relative}
.sig canvas{display:block;width:100%;height:170px;background:#fff;border:1.5px dashed #7f99b2;border-radius:12px;touch-action:none}
.sig .clear{position:absolute;right:8px;top:8px;min-height:36px;padding:4px 10px;font-size:14px}
.sig .hint{position:absolute;left:14px;bottom:10px;color:#93a8bc;font-size:14px;pointer-events:none}
.done{border-left:6px solid var(--tst)}
.done.q{border-left-color:var(--gold)}
.qrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.qrow:first-child{border-top:0}
.qrow em{font-style:normal;color:var(--ink2)}
.qrow .e{color:var(--err)}

.qrbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;max-width:360px;margin:6px auto 10px}
.qrbox svg{display:block;width:100%;height:auto}
/* ── PV prise en charge / restitution ── */
#v-pv{--c:var(--pv)}
#v-pv input[type=date],#v-pv input[type=time],#v-pv textarea{width:100%;min-height:50px;border:1.5px solid #8fa9c2;border-radius:10px;background:#fff;padding:11px 13px;font-size:17px;color:var(--ink)}
#v-pv textarea{min-height:96px;resize:vertical;font:inherit}
#v-pv input[readonly]{background:#eef3f8;border-color:var(--line);font-weight:600}
.pv-seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid #8fa9c2;border-radius:11px;overflow:hidden}
.pv-seg button{border:0;background:#fff;min-height:54px;padding:8px;font-weight:600;cursor:pointer;color:var(--ink2)}
.pv-seg button+button{border-left:1.5px solid #8fa9c2}
.pv-seg button.on{background:var(--pv);color:#fff}
.pv-grp{font-family:var(--cond);font-weight:700;font-size:19px;margin:14px 0 4px;color:var(--ink)}
.pv-grp:first-child{margin-top:0}
.pv-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.pv-row .lb{font-weight:500}
.pv-sub{font-weight:600;color:var(--ink);padding:10px 0 2px;border-top:1px solid var(--line)}
.pv-row.in{border-top:1px dashed var(--line)}
.pv-row.in .lb{padding-left:12px;border-left:3px solid color-mix(in srgb,var(--pv) 35%,#fff)}
.pv-row .lb small{display:block;color:var(--ink2);font-weight:400;font-size:14px}
.pv-row.on .lb{color:var(--pv)}
.pv-row input[type=checkbox]{width:28px;height:28px;margin:0;accent-color:var(--pv)}
.pv-step{display:flex;align-items:center;border:1.5px solid #8fa9c2;border-radius:10px;overflow:hidden;background:#fff}
.pv-step button{width:40px;height:44px;border:0;background:#eef3f8;font-size:22px;cursor:pointer;color:var(--ink)}
#v-pv .pv-step input{width:48px;min-height:44px;border:0;border-radius:0;text-align:center;padding:4px;font-size:17px}
.pv-head{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:13px;color:var(--ink2);font-weight:600;padding-bottom:6px}
.pv-head span:nth-child(2){width:28px;text-align:center}
.pv-head span:nth-child(3){width:128px;text-align:center}
.pv-bad input,.pv-bad select,.pv-bad .pv-seg,.pv-bad canvas{border-color:var(--err)!important}
.pv-warn{background:#fff2d6;border:1px solid #f0d08a;border-radius:12px;padding:12px 14px;margin:12px 0;color:var(--warn)}
/* ── Attestation imprimable ── */
#print{display:none}
@media print{
  body{background:#fff}
  #band,main,.sheet{display:none!important}
  #print{display:block;font-family:var(--sans);color:#000;font-size:11pt;padding:0}
  #print h1{font-size:20pt;margin:0 0 4pt}
  #print table{width:100%;border-collapse:collapse;margin:8pt 0}
  #print td,#print th{border:1px solid #888;padding:3pt 5pt;text-align:left;vertical-align:top}
  #print .sigs{display:grid;grid-template-columns:1fr 1fr;gap:12pt;margin-top:10pt}
  #print .sigs img{width:100%;height:90pt;object-fit:contain;border:1px solid #888}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<!-- ═════════ SAFETY REPORT ═════════ -->
<main id="v-report" class="hide">
  <iframe id="report-frame" title="Safety Report" allow="camera; geolocation"></iframe>
  <div class="report-alt"><a id="report-open" href="#" target="_blank" rel="noopener" data-t="report_open"></a></div>
</main>

<!-- ═════════ DOCUMENTATION ═════════ -->
<main id="v-docs" class="hide" style="--c:var(--docs)">
  <section id="d-login" class="hide">
    <h1 data-t="docs_title"></h1>
    <p class="lead" data-t="docs_login_lead"></p>
    <div class="panel">
      <div id="d-step1">
        <div class="f"><label for="d-email" data-t="email_saf"></label><input id="d-email" type="email" inputmode="email" autocomplete="email" placeholder="prenom.nom@saf-helico.com"></div>
        <button class="btn main" id="d-send" type="button" data-t="send_code"></button>
      </div>
      <div id="d-step2" class="hide">
        <p class="note" id="d-sent" style="margin:0 0 12px"></p>
        <div class="f"><label for="d-code" data-t="code6"></label><input id="d-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" style="letter-spacing:.4em;font-size:22px;text-align:center"></div>
        <button class="btn main" id="d-verify" type="button" data-t="sign_in"></button>
        <button class="btn link" id="d-restart" type="button" data-t="other_email"></button>
      </div>
      <p class="msg err" id="d-err"></p>
    </div>
  </section>
  <section id="d-app" class="hide">
    <h1 data-t="docs_title"></h1>
    <div class="who" style="margin:0 0 10px"><p class="note" id="d-me" style="margin:0"></p><button class="btn link" id="d-out" type="button" data-t="sign_out"></button></div>
    <input type="search" id="d-q" autocomplete="off">
    <div id="d-must"></div>
    <div class="crumbs" id="d-crumbs"></div>
    <div id="d-list"></div>
  </section>
  <p class="msg err" id="d-fatal"></p>
</main>

<!-- ═════════ BRIEFING TST — côté formateur : session + QR code ═════════ -->
<main id="v-tst" class="hide">
  <section id="t-setup">
    <h1 data-t="tst_title"></h1>
    <p class="lead" data-t="tst_lead"></p>

    <h2 data-t="sec_briefer"></h2>
    <div class="panel">
      <div class="f"><label for="t-trainer" data-t="trainer_pick"></label><select id="t-trainer"></select></div>
      <p class="msg" id="t-bmsg"></p>
    </div>

    <h2 data-t="sec_mission"></h2>
    <div class="panel">
      <div class="row2">
        <div class="f"><label for="t-mref"><span data-t="mission_ref"></span> <span class="opt" data-t="optional"></span></label><input id="t-mref" type="text" maxlength="120" placeholder="M-2026-0004"></div>
        <div class="f"><label for="t-site"><span data-t="site"></span> <span class="opt" data-t="optional"></span></label><input id="t-site" type="text" maxlength="200"></div>
      </div>
    </div>

    <h2 data-t="sig_briefer"></h2>
    <p class="note" data-t="sig_briefer_note" style="margin-top:0"></p>
    <div class="f"><div class="sig"><canvas id="sig-brf" aria-label="Signature formateur"></canvas><span class="hint" data-t="sign_here"></span><button class="btn clear" type="button" data-clear="sig-brf" data-t="clear"></button></div></div>

    <p class="msg err" id="t-why"></p>
    <button class="btn main" id="t-open" type="button" data-t="open_session" style="margin-top:8px"></button>
  </section>

  <section id="t-live" class="hide">
    <h1 data-t="qr_title"></h1>
    <p class="lead" data-t="qr_lead"></p>
    <div class="qrbox" id="t-qr"></div>
    <p class="note" id="t-sinfo" style="text-align:center"></p>
    <div class="stack" style="margin-top:12px">
      <button class="btn wide" id="t-share" type="button" data-t="share_link"></button>
      <button class="btn wide" id="t-here" type="button" data-t="fill_here"></button>
    </div>
    <div class="prog"><h2 data-t="received"></h2><span id="t-rcount"></span></div>
    <div class="panel" id="t-rlist"></div>
    <div class="stack">
      <button class="btn wide" id="t-close" type="button" data-t="close_session"></button>
    </div>
  </section>
</main>

<!-- ═════════ BRIEFING TST — côté TST (page ouverte par le QR code) ═════════ -->
<main id="v-brief" class="hide" style="--c:var(--tst)">
  <section id="b-form">
    <h1 data-t="brief_title"></h1>
    <div class="panel" id="b-head"></div>

    <h2 data-t="sec_tst"></h2>
    <div class="panel">
      <div class="row2">
        <div class="f"><label for="t-last" data-t="last"></label><input id="t-last" type="text" maxlength="120" autocomplete="family-name" autocapitalize="characters"></div>
        <div class="f"><label for="t-first" data-t="first"></label><input id="t-first" type="text" maxlength="120" autocomplete="given-name" autocapitalize="words"></div>
      </div>
      <div class="row2">
        <div class="f"><label for="t-company" data-t="company"></label><input id="t-company" type="text" maxlength="150" autocomplete="organization"></div>
        <div class="f"><label for="t-func"><span data-t="function"></span> <span class="opt" data-t="optional"></span></label><input id="t-func" type="text" maxlength="120" autocomplete="organization-title"></div>
      </div>
      <div class="f"><label for="t-email"><span data-t="email"></span> <span class="opt" data-t="optional"></span></label><input id="t-email" type="email" inputmode="email" maxlength="254" autocomplete="email"></div>
      <label class="sw"><input type="checkbox" id="t-onboard"><span data-t="onboard"></span></label>
    </div>

    <div class="prog"><h2 data-t="sec_topics"></h2><span id="t-count"></span></div>
    <p class="note" data-t="topics_hint" style="margin-top:0"></p>
    <div class="bar"><i id="t-bar"></i></div>
    <div id="t-items"></div>

    <h2 data-t="sig_tst"></h2>
    <div class="f"><div class="sig"><canvas id="sig-tst" aria-label="Signature TST"></canvas><span class="hint" data-t="sign_here"></span><button class="btn clear" type="button" data-clear="sig-tst" data-t="clear"></button></div></div>

    <p class="msg err" id="b-why"></p>
    <button class="btn main" id="b-send" type="button" data-t="send_brief" style="margin-top:8px"></button>
    <p class="note" data-t="send_note"></p>
  </section>

  <section id="b-done" class="hide">
    <div class="panel done" id="t-done-box">
      <h1 id="t-done-title" style="font-size:28px"></h1>
      <p id="t-done-text" style="margin:6px 0 0"></p>
      <p class="note" id="t-done-ref"></p>
    </div>

/* ── Utilitaires ── */
const $ = id => document.getElementById(id);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
let lang = LS.get(K.lang, null) || ((navigator.language || 'fr').slice(0,2));
if(!I18N[lang]) lang = 'fr';
const T = (k, vars) => { let s = (I18N[lang][k] != null ? I18N[lang][k] : I18N.fr[k]) || k; if(vars) for(const v in vars) s = s.split('{' + v + '}').join(vars[v]); return s; };
const fmtDate = d => new Date(String(d).length === 10 ? d + 'T12:00:00' : d).toLocaleDateString(lang === 'en' ? 'en-GB' : lang, { day:'2-digit', month:'long', year:'numeric' });
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const plus12m = iso => { const d = new Date(iso + 'T12:00:00'); d.setFullYear(d.getFullYear() + 1); return d.toISOString().slice(0,10); };

/* ── Langue ── */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-l]').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
  $('d-q').placeholder = T('search');
  setWhere();
  drawItems(); updateTst(); renderQueue(); pvApply(); renderBadges(); drawTrainers();
  if(DOCS.ready) renderDocs();
  if(view === 'brief') renderBriefHead();
  if(view === 'tst' && currentSession()) drawQr(currentSession());
  if(!$('b-done').classList.contains('hide') && LAST) showDone(LAST.state, LAST.item, LAST.err);
}

const VIEWS = ['home','report','docs','tst','brief','pv'];
let view = 'home';
function setWhere(){ $('where').textContent = view === 'home' ? 'SAF Mobile' : view === 'report' ? 'Safety Report' : view === 'docs' ? T('docs_title') : view === 'brief' ? '' : view === 'pv' ? TP('tile_t') : T('tst_title'); }
function route(){
  const raw = (location.hash || '').replace('#','');
  const briefId = raw.startsWith('brief=') ? raw.slice(6) : null;
  view = briefId ? 'brief' : VIEWS.includes(raw) ? raw : 'home';
  VIEWS.forEach(x => $('v-' + x).classList.toggle('hide', x !== view));
  $('back').classList.toggle('hide', view === 'home' || view === 'brief');
  document.querySelector('#band img').classList.toggle('hide', view !== 'home' && view !== 'brief');
  setWhere(); window.scrollTo(0, 0);
  if(view === 'report' && !$('report-frame').src) $('report-frame').src = REPORT_URL;
  if(view === 'docs') docsEnter();
  if(view === 'tst') tstEnter();
  if(view === 'pv') pvEnter();
  if(view === 'brief') briefEnter(briefId);
  if(view === 'home') renderBadges();
  syncQueue(); syncPv();
}

/* ════════════════ DOCUMENTATION ════════════════ */
const DOCS = { ready:false, folders:[], docs:[], reads:{}, cur:null, email:'' };
let sms = null;
function smsClient(){
  if(sms) return sms;
  if(!window.supabase || !window.supabase.createClient) return null;
  sms = window.supabase.createClient(SMS_URL, SMS_ANON, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } });
  return sms;
}
function docsShow(which){ $('d-login').classList.toggle('hide', which !== 'login'); $('d-app').classList.toggle('hide', which !== 'app'); }
async function docsEnter(){
  $('d-fatal').textContent = '';
  const c = smsClient();
  if(!c){ docsShow(''); $('d-fatal').textContent = navigator.onLine ? T('lib_missing') : T('offline'); return; }
  const { data } = await c.auth.getSession();
  if(!data || !data.session){ docsShow('login'); return; }
  DOCS.email = data.session.user.email || '';
  docsShow('app'); $('d-me').textContent = T('signed_as', { e: DOCS.email });
  if(!DOCS.ready) await docsLoad();
}
async function docsLoad(){
  const c = smsClient(); $('d-list').innerHTML = '<div class="list"><div class="empty">…</div></div>';
  try{
    const role = await c.rpc('portal_role');
    if(!role.error && !role.data){ $('d-list').innerHTML = ''; $('d-fatal').textContent = T('not_staff'); return; }
    const [f, d, r] = await Promise.all([
      c.from('portal_folders').select('id,parent_id,name,sort_order'),
      c.from('portal_docs').select('id,title,reference,issue,revision,revision_date,folder_id,storage_path,file_name,mandatory,doc_type,published_at').eq('status','published'),
      c.from('portal_reads').select('doc_id,read_at').eq('user_id', (await c.auth.getUser()).data.user.id)
    ]);
    if(f.error) throw f.error; if(d.error) throw d.error;
    DOCS.folders = f.data || []; DOCS.docs = d.data || [];
    DOCS.reads = {}; (r.data || []).forEach(x => { DOCS.reads[x.doc_id] = x.read_at; });
    DOCS.ready = true; renderDocs(); renderBadges();
  }catch(e){ $('d-list').innerHTML = ''; $('d-fatal').textContent = navigator.onLine ? (e.message || String(e)) : T('offline'); }
}
function childFolders(pid){ return DOCS.folders.filter(f => (f.parent_id || null) === (pid || null)).sort((a,b) => (a.sort_order||0)-(b.sort_order||0) || a.name.localeCompare(b.name)); }
function docsIn(fid){ return DOCS.docs.filter(d => (d.folder_id || null) === (fid || null)).sort((a,b) => a.title.localeCompare(b.title)); }
function countDeep(fid){ return docsIn(fid).length + childFolders(fid).reduce((n, f) => n + countDeep(f.id), 0); }
function pathOf(fid){ const p = []; let f = DOCS.folders.find(x => x.id === fid); while(f){ p.unshift(f); f = DOCS.folders.find(x => x.id === f.parent_id); } return p; }
const unreadMust = () => DOCS.docs.filter(d => d.mandatory && !DOCS.reads[d.id]);
function docRow(d){
  const json = /\.json$/i.test(d.storage_path || '');
  const sub = [d.reference, d.issue ? T('issue') + ' ' + d.issue : '', d.revision ? T('rev') + ' ' + d.revision : ''].filter(Boolean).join(' – ');
  const tag = d.mandatory ? (DOCS.reads[d.id] ? '<span class="tag read">' + h(T('read')) + '</span>' : '<span class="tag must">' + h(T('to_read')) + '</span>') : '';
  return '<button class="li" type="button" data-doc="' + h(d.id) + '"><span class="k ' + (json ? 'htm">HTML' : 'pdf">PDF') + '</span><span class="t"><b>' + h(d.title) + tag + '</b>' + (sub ? '<small>' + h(sub) + '</small>' : '') + '</span></button>';
}
function renderDocs(){
  const q = $('d-q').value.trim().toLowerCase();
  const must = unreadMust();
  $('d-must').innerHTML = (!q && must.length) ? '<h2>' + h(T('must_read')) + '</h2><div class="list">' + must.map(docRow).join('') + '</div>' : '';
  if(q){
    $('d-crumbs').innerHTML = '';
    const hits = DOCS.docs.filter(d => [d.title, d.reference, d.file_name].join(' ').toLowerCase().includes(q));
    $('d-list').innerHTML = '<div class="list">' + (hits.length ? hits.map(docRow).join('') : '<div class="empty">' + h(T('no_result')) + '</div>') + '</div>';
  }else{
    const p = DOCS.cur ? pathOf(DOCS.cur) : [];
    $('d-crumbs').innerHTML = '<button type="button" data-f="">' + h(T('all_docs')) + '</button>' + p.map((f, i) => '<span>›</span>' + (i === p.length - 1 ? '<span>' + h(f.name) + '</span>' : '<button type="button" data-f="' + h(f.id) + '">' + h(f.name) + '</button>')).join('');
    const fs = childFolders(DOCS.cur).filter(f => countDeep(f.id) > 0), ds = docsIn(DOCS.cur);
    const rows = fs.map(f => '<button class="li" type="button" data-f="' + h(f.id) + '"><span class="k fd">▸</span><span class="t"><b>' + h(f.name) + '</b></span><span class="n">' + h(T('n_docs', { n: countDeep(f.id) })) + '</span></button>').join('') + ds.map(docRow).join('');
    $('d-list').innerHTML = '<div class="list">' + (rows || '<div class="empty">' + h(T('no_doc')) + '</div>') + '</div>';
  }
}
$('v-docs').addEventListener('click', e => {
  const f = e.target.closest('[data-f]'); if(f){ DOCS.cur = f.dataset.f || null; renderDocs(); window.scrollTo(0, 0); return; }
  const d = e.target.closest('[data-doc]'); if(d) openSheet(DOCS.docs.find(x => x.id === d.dataset.doc));
});
$('d-q').addEventListener('input', renderDocs);

function openSheet(d){
  if(!d) return;
  const sub = [d.reference, d.issue ? T('issue') + ' ' + d.issue : '', d.revision ? T('rev') + ' ' + d.revision : '', d.revision_date ? fmtDate(d.revision_date) : ''].filter(Boolean).join(' – ');
  const read = DOCS.reads[d.id];
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.innerHTML = '<div role="dialog" aria-modal="true"><h3>' + h(d.title) + '</h3><p class="meta">' + h(sub) + '</p><div class="stack">'
    + '<button class="btn main" type="button" id="s-open">' + h(T('open_doc')) + '</button>'
    + (d.mandatory ? (read ? '<p class="msg ok">' + h(T('ack_done', { d: fmtDate(read) })) + '</p>'
        : '<label class="sw"><input type="checkbox" id="s-chk"><span>' + h(T('ack_label')) + '</span></label><button class="btn wide" type="button" id="s-ack" disabled>' + h(T('ack_btn')) + '</button>') : '')
    + '<p class="msg" id="s-msg"></p><button class="btn wide" type="button" id="s-close">' + h(T('close')) + '</button></div></div>';
  document.body.appendChild(sh);
  const close = () => sh.remove();
  sh.addEventListener('click', e => { if(e.target === sh) close(); });
  sh.querySelector('#s-close').onclick = close;
  sh.querySelector('#s-open').onclick = async () => {
    /* fenêtre ouverte tout de suite (Safari bloque window.open après une attente) */
    const w = window.open('', '_blank');
    try{
      const s = await smsClient().storage.from(DOC_BUCKET).createSignedUrl(d.storage_path, 900);
      if(s.error || !s.data) throw (s.error || new Error('url'));
      const url = /\.json$/i.test(d.storage_path) ? READER_URL + '?doc=' + encodeURIComponent(s.data.signedUrl) : s.data.signedUrl;
      if(w) w.location.href = url; else location.href = url;
    }catch(e){ if(w) w.close(); const m = sh.querySelector('#s-msg'); m.className = 'msg err'; m.textContent = T('open_err') + ' ' + (e.message || ''); }
  };
  const chk = sh.querySelector('#s-chk'), ack = sh.querySelector('#s-ack');
  if(chk){ chk.onchange = () => { ack.disabled = !chk.checked; };
    ack.onclick = async () => {
      ack.disabled = true; const m = sh.querySelector('#s-msg');
      const r = await smsClient().from('portal_reads').insert({ doc_id: d.id });
      if(r.error && !/duplicate|unique/i.test(r.error.message)){ m.className = 'msg err'; m.textContent = r.error.message; ack.disabled = false; return; }
      DOCS.reads[d.id] = new Date().toISOString(); m.className = 'msg ok'; m.textContent = T('ack_ok');
      chk.closest('label').remove(); ack.remove(); renderDocs(); renderBadges();
    };
  }
}

/* connexion par code e-mail — même mécanisme que le portail */
$('d-send').onclick = async () => {
  const e = $('d-email').value.trim().toLowerCase(); $('d-err').textContent = '';
  if(!/^[^@\s]+@saf-helico\.com$/i.test(e)){ $('d-err').textContent = T('bad_email'); return; }
  const c = smsClient(); if(!c){ $('d-err').textContent = T('lib_missing'); return; }
  $('d-send').disabled = true;
  const r = await c.auth.signInWithOtp({ email: e, options:{ shouldCreateUser:true } });
  $('d-send').disabled = false;
  if(r.error){ $('d-err').textContent = /rate|seconds|too many/i.test(r.error.message) ? T('rate') : r.error.message; return; }
  $('d-step1').classList.add('hide'); $('d-step2').classList.remove('hide');
  $('d-sent').textContent = T('code_sent', { e }); $('d-code').value = ''; $('d-code').focus();
};
$('d-verify').onclick = async () => {
  const code = $('d-code').value.replace(/\D/g, ''); $('d-err').textContent = '';
  if(code.length !== 6){ $('d-err').textContent = T('bad_code'); return; }
  $('d-verify').disabled = true;
  const r = await smsClient().auth.verifyOtp({ email: $('d-email').value.trim().toLowerCase(), token: code, type:'email' });
  $('d-verify').disabled = false;
  if(r.error){ $('d-err').textContent = T('wrong_code'); return; }
  DOCS.ready = false; docsEnter();
};
$('d-code').addEventListener('input', () => { const v = $('d-code').value.replace(/\D/g, '').slice(0, 6); $('d-code').value = v; if(v.length === 6) $('d-verify').click(); });
$('d-email').addEventListener('keydown', e => { if(e.key === 'Enter') $('d-send').click(); });
$('d-restart').onclick = () => { $('d-step2').classList.add('hide'); $('d-step1').classList.remove('hide'); $('d-err').textContent = ''; };
$('d-out').onclick = async () => { try{ await smsClient().auth.signOut(); }catch(e){} DOCS.ready = false; DOCS.docs = []; DOCS.reads = {}; $('d-step2').classList.add('hide'); $('d-step1').classList.remove('hide'); docsShow('login'); renderBadges(); };

async function ctRpc(fn, body){
  const r = await fetch(CT_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:CT_ANON, Authorization:'Bearer ' + CT_ANON }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => null);
  if(!r.ok){ const err = new Error((j && j.message) || ('HTTP ' + r.status)); err.server = true; throw err; }
  return j;
}

/* Signatures au doigt */
function Pad(id){
  const cv = $(id), ctx = cv.getContext('2d'); let strokes = [], cur = null;
  const hint = () => cv.parentNode.querySelector('.hint');
  const draw = () => { ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight); ctx.strokeStyle = '#0a2238'; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for(const s of strokes){ if(!s.length) continue; ctx.beginPath(); ctx.moveTo(s[0][0], s[0][1]); for(const p of s.slice(1)) ctx.lineTo(p[0], p[1]); if(s.length === 1) ctx.lineTo(s[0][0] + .1, s[0][1]); ctx.stroke(); } };
  const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); cur = [pt(e)]; strokes.push(cur); hint().style.display = 'none'; draw(); });
  cv.addEventListener('pointermove', e => { if(!cur) return; cur.push(pt(e)); draw(); });
  ['pointerup','pointercancel'].forEach(t => cv.addEventListener(t, () => { cur = null; }));
  return {
    resize(){ if(!cv.clientWidth) return; const d = window.devicePixelRatio || 1; cv.width = cv.clientWidth * d; cv.height = cv.clientHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); draw(); },
    clear(){ strokes = []; hint().style.display = ''; draw(); },
    filled(){ return strokes.reduce((n, s) => n + s.length, 0) > 8; },
    png(){ const w = Math.min(600, cv.clientWidth), k = w / cv.clientWidth, o = document.createElement('canvas'); o.width = w; o.height = Math.round(cv.clientHeight * k);
      const c = o.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, o.width, o.height); c.strokeStyle = '#000'; c.lineWidth = 2.4; c.lineCap = 'round'; c.lineJoin = 'round';
      for(const s of strokes){ if(!s.length) continue; c.beginPath(); c.moveTo(s[0][0]*k, s[0][1]*k); for(const p of s.slice(1)) c.lineTo(p[0]*k, p[1]*k); if(s.length === 1) c.lineTo(s[0][0]*k + .1, s[0][1]*k); c.stroke(); }
      return o.toDataURL('image/png'); }
  };
}

/* file d'attente hors ligne (téléphone du TST) */
let syncing = false;
async function syncQueue(){
  if(syncing) return; syncing = true;
  for(const it of LS.get(K.queue, [])){
    if(it.err && !it.force) continue;
    try{
      const r = await ctRpc('tst_briefing_submit', { p: it.p });
      const sent = LS.get(K.sent, []);
      sent.unshift({ ref: it.p.ref, name: it.p.tst_first_name + ' ' + it.p.tst_last_name.toUpperCase(), company: it.p.tst_company, on: it.extra.briefed_on, valid_until: r.valid_until });
      LS.set(K.sent, sent.slice(0, 40));
      LS.set(K.queue, LS.get(K.queue, []).filter(x => x.p.ref !== it.p.ref));
    }catch(e){
      if(!e.server) break;                         /* pas de réseau : on réessaiera */
      const q = LS.get(K.queue, []), x = q.find(y => y.p.ref === it.p.ref); if(x){ x.err = e.message; x.force = false; x.tries++; LS.set(K.queue, q); }
    }
  }
  syncing = false; renderQueue(); renderBadges();
}
window.addEventListener('online', syncQueue);
setInterval(() => { if(navigator.onLine && LS.get(K.queue, []).some(x => !x.err)) syncQueue(); }, 60000);

const TP = (k, vars) => { let s = ((I18N_PV[lang] || {})[k] != null ? I18N_PV[lang][k] : I18N_PV.fr[k]) || k; if(vars) for(const v in vars) s = s.split('{' + v + '}').join(vars[v]); return s; };
const PVL = () => Math.max(0, ['fr','en','it','es'].indexOf(lang));
const K_PV = { queue:'safm_pv_queue', signer:'safm_pv_saf_signer' };
const PV = { mvt:null, last:null };
const PAD_PV1 = Pad('p-sig1'), PAD_PV2 = Pad('p-sig2');
document.querySelectorAll('[data-pvclear]').forEach(b => b.addEventListener('click', () => (b.dataset.pvclear === '1' ? PAD_PV1 : PAD_PV2).clear()));
window.addEventListener('resize', () => { if(view === 'pv'){ PAD_PV1.resize(); PAD_PV2.resize(); } });

async function smsRpc(fn, body){
  const r = await fetch(SMS_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SMS_ANON, Authorization:'Bearer ' + SMS_ANON }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => null);
  if(!r.ok){ const err = new Error((j && j.message) || ('HTTP ' + r.status)); err.server = true; throw err; }
  return j;
}
const pvErr = m => { const k = 'err_' + String(m || '').trim(); return I18N_PV.fr[k] ? TP(k) : TP('err_generic', { m }); };

function pvDrawItems(){
  const keep = {}; document.querySelectorAll('#p-items .pv-row').forEach(r => { keep[r.dataset.id] = { on:r.querySelector('input[type=checkbox]').checked, n:r.querySelector('.pv-step input').value }; });
  const j = PVL();
  $('p-items').innerHTML = PV_ITEMS.map(it => it.g ? '<div class="pv-grp">' + h(it.g[j]) + '</div>'
    : it.s ? '<div class="pv-sub">' + h(PV_SUBS[it.s][j]) + '</div>'
    : '<div class="pv-row' + (it.p ? ' in' : '') + '" data-id="' + it.id + '"><span class="lb">' + h(it.l[j]) + (it.n ? '<small>' + h(it.n[j]) + '</small>' : '') + '</span>'
      + '<input type="checkbox" aria-label="' + h(pvLabel(it, j)) + '">'
      + '<span class="pv-step"><button type="button" data-d="-1" aria-label="−">−</button><input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="0" aria-label="' + h(TP('qty')) + '"><button type="button" data-d="1" aria-label="+">+</button></span></div>').join('');
  document.querySelectorAll('#p-items .pv-row').forEach(r => {
    const box = r.querySelector('input[type=checkbox]'), num = r.querySelector('.pv-step input');
    const sync = () => r.classList.toggle('on', box.checked);
    if(keep[r.dataset.id]){ box.checked = keep[r.dataset.id].on; num.value = keep[r.dataset.id].n; sync(); }
    box.addEventListener('change', () => { if(box.checked && !(+num.value > 0)) num.value = 1; if(!box.checked) num.value = ''; sync(); });
    num.addEventListener('input', () => { num.value = num.value.replace(/\D/g, ''); box.checked = +num.value > 0; sync(); });
    r.querySelectorAll('.pv-step button').forEach(b => b.addEventListener('click', () => { const v = Math.max(0, Math.min(999, (parseInt(num.value) || 0) + (+b.dataset.d))); num.value = v || ''; box.checked = v > 0; sync(); }));
  });
}
function pvTakerName(){ return $('p-taker').value.trim() || TP('the_taker'); }
function pvApply(){
  document.querySelectorAll('[data-p]').forEach(el => { el.textContent = TP(el.dataset.p); });
  $('pv-tile-t').textContent = TP('tile_t');
  $('orbit-hint').textContent = ({fr:'Touchez une planète pour ouvrir le module',en:'Tap a planet to open the module',it:'Tocca un pianeta per aprire il modulo',es:'Toque un planeta para abrir el módulo'})[lang] || 'Touchez une planète pour ouvrir le module';
  $('p-mvt-pickup').textContent = TP('pickup', { t: pvTakerName() });
  $('p-sig1-label').textContent = TP('sig_taker', { t: $('p-taker').value.trim() || '—' }) + ' *';
  $('p-signer1').placeholder = TP('signer'); $('p-signer2').placeholder = TP('signer');
  const sel = $('p-reg'), cur = sel.value;
  sel.innerHTML = '<option value="">' + h(TP('choose')) + '</option>' + PV_FLEET.map(a => '<option>' + a.reg + '</option>').join(''); sel.value = cur;
  pvDrawItems(); pvRenderQueue();
  if(!$('p-done').classList.contains('hide') && PV.last) pvShowDone(PV.last.state, PV.last.item, PV.last.err);
}
function pvSetMvt(m){ PV.mvt = m; document.querySelectorAll('[data-mvt]').forEach(b => b.classList.toggle('on', b.dataset.mvt === m)); $('pf-mvt').classList.remove('pv-bad'); }
document.querySelectorAll('[data-mvt]').forEach(b => b.addEventListener('click', () => pvSetMvt(b.dataset.mvt)));
$('p-taker').addEventListener('input', () => { $('p-mvt-pickup').textContent = TP('pickup', { t: pvTakerName() }); $('p-sig1-label').textContent = TP('sig_taker', { t: $('p-taker').value.trim() || '—' }) + ' *'; $('pf-taker').classList.remove('pv-bad'); });
$('p-reg').addEventListener('change', () => { const a = PV_FLEET.find(x => x.reg === $('p-reg').value); $('p-type').value = a ? a.type : ''; $('p-msn').value = a ? a.msn : ''; $('pf-reg').classList.remove('pv-bad'); });
['p-date','p-time','p-signer1','p-signer2'].forEach(id => $(id).addEventListener('input', () => $(id).closest('.f').classList.remove('pv-bad')));
function pvNow(){ const d = new Date(); $('p-date').value = today(); $('p-time').value = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function pvReset(){
  $('p-taker').value = ''; $('p-reg').value = ''; $('p-type').value = ''; $('p-msn').value = ''; $('p-order').value = ''; $('p-obs').value = ''; $('p-signer1').value = '';
  $('p-signer2').value = LS.get(K_PV.signer, '') || ''; pvSetMvt(null); pvNow(); PAD_PV1.clear(); PAD_PV2.clear();
  document.querySelectorAll('#p-items .pv-row').forEach(r => { r.querySelector('input[type=checkbox]').checked = false; r.querySelector('.pv-step input').value = ''; r.classList.remove('on'); });
  document.querySelectorAll('#v-pv .pv-bad').forEach(x => x.classList.remove('pv-bad')); $('p-why').textContent = '';
  $('p-form').classList.remove('hide'); $('p-done').classList.add('hide'); pvApply();
}
function pvEnter(){ requestAnimationFrame(() => { PAD_PV1.resize(); PAD_PV2.resize(); }); pvRenderQueue(); }

$('p-save').addEventListener('click', async () => {
  const bad = [];
  if(!$('p-taker').value.trim()) bad.push('pf-taker');
  if(!PV.mvt) bad.push('pf-mvt');
  if(!$('p-reg').value) bad.push('pf-reg');
  if(!$('p-date').value) bad.push('pf-date');
  if(!$('p-time').value) bad.push('pf-time');
  if($('p-signer1').value.trim().length < 2 || !PAD_PV1.filled()) bad.push('pf-sig1');
  if($('p-signer2').value.trim().length < 2 || !PAD_PV2.filled()) bad.push('pf-sig2');
  document.querySelectorAll('#v-pv .pv-bad').forEach(x => x.classList.remove('pv-bad'));
  bad.forEach(id => $(id).classList.add('pv-bad'));
  if(bad.length){ $('p-why').textContent = TP('missing'); $(bad[0]).scrollIntoView({ behavior:'smooth', block:'center' }); return; }
  $('p-why').textContent = '';
  const a = PV_FLEET.find(x => x.reg === $('p-reg').value);
  const stamp = $('p-date').value.replace(/-/g,'') + '-' + $('p-time').value.replace(':','');
  const rnd = Math.random().toString(36).slice(2, 5).toUpperCase();
  const equipment = [...document.querySelectorAll('#p-items .pv-row')].map(r => { const it = PV_ITEMS.find(x => x.id === r.dataset.id);
    return { id: it.id, label: pvLabel(it, 0), present: r.querySelector('input[type=checkbox]').checked, n: parseInt(r.querySelector('.pv-step input').value) || 0 }; });
  const p = { ref: 'PV-' + a.reg.replace('-','') + '-' + stamp + '-' + rnd, movement: PV.mvt, taker: $('p-taker').value.trim(), reg: a.reg, aircraft_type: a.type, msn: a.msn,
    event_date: $('p-date').value, event_time: $('p-time').value, order_no: $('p-order').value.trim(), equipment, observations: $('p-obs').value.trim(),
    taker_signer: $('p-signer1').value.trim(), taker_signature_png: PAD_PV1.png(), saf_signer: $('p-signer2').value.trim(), saf_signature_png: PAD_PV2.png(), lang };
  LS.set(K_PV.signer, p.saf_signer);
  $('p-save').disabled = true;
  try{ await smsRpc('fleet_handover_submit', { p }); pvShowDone('sent', p); }
  catch(e){
    if(e.server){ pvShowDone('err', p, e.message); }
    else { const q = LS.get(K_PV.queue, []); q.push({ p, err:null, tries:0 }); if(!LS.set(K_PV.queue, q)) { pvShowDone('err', p, 'storage'); } else pvShowDone('queued', p); }
  }
  finally{ $('p-save').disabled = false; renderBadges(); pvRenderQueue(); }
});
function pvShowDone(state, item, err){
  PV.last = { state, item, err };
  $('p-form').classList.add('hide'); $('p-done').classList.remove('hide');
  const m = TP(item.movement === 'pickup' ? 'mv_pickup' : 'mv_return');
  $('p-done-box').style.borderLeftColor = state === 'sent' ? 'var(--pv)' : state === 'err' ? 'var(--err)' : 'var(--gold)';
  $('p-done-title').textContent = state === 'sent' ? TP('sent_title') : state === 'err' ? TP('rejected_title') : TP('queued_title');
  $('p-done-text').textContent = state === 'sent' ? TP('sent_text', { m, r: item.reg, t: item.taker }) : state === 'err' ? pvErr(err) : TP('queued_text');
  $('p-done-ref').textContent = TP('ref', { r: item.ref });
  $('p-damage').classList.toggle('hide', !item.observations);
  pvBuildPrint(item); window.scrollTo(0, 0);
}
$('p-new').onclick = () => { PV.last = null; pvReset(); window.scrollTo(0, 0); requestAnimationFrame(() => { PAD_PV1.resize(); PAD_PV2.resize(); }); };
$('p-print').onclick = () => { if(PV.last) pvBuildPrint(PV.last.item); window.print(); };
$('p-home').onclick = () => { location.hash = ''; };
$('p-to-report').onclick = () => { location.hash = 'report'; };

function pvBuildPrint(it){
  const j = PVL(), m = TP(it.movement === 'pickup' ? 'mv_pickup' : 'mv_return'), [y, mo, d] = it.event_date.split('-');
  const rows = it.equipment.map(e => { const def = PV_ITEMS.find(x => x.id === e.id); const lb = def ? pvLabel(def, j) : e.label;
    return '<tr><td>' + h(lb) + '</td><td style="text-align:center">' + (e.present ? '✓' : '—') + '</td><td style="text-align:center">' + (e.n || '') + '</td></tr>'; }).join('');
  $('print').innerHTML = '<img src="' + document.querySelector('#band img').src + '" alt="" style="height:44pt;float:right">'
    + '<h1>' + h(TP('pr_title', { m })) + '</h1><p>' + h(TP('ref', { r: it.ref })) + '</p>'
    + '<table><tr><th>' + h(TP('taker')) + '</th><td colspan="3">' + h(it.taker) + '</td></tr>'
    + '<tr><th>' + h(TP('movement')) + '</th><td>' + h(it.movement === 'pickup' ? TP('pickup', { t: it.taker }) : TP('return')) + '</td><th>' + h(TP('order')) + '</th><td>' + h(it.order_no || '—') + '</td></tr>'
    + '<tr><th>' + h(TP('reg')) + '</th><td>' + h(it.reg) + '</td><th>' + h(TP('msn')) + '</th><td>' + h(it.msn) + '</td></tr>'
    + '<tr><th>' + h(TP('type')) + '</th><td>' + h(it.aircraft_type) + '</td><th>' + h(TP('date')) + '</th><td>' + d + '/' + mo + '/' + y + ' · ' + h(it.event_time) + '</td></tr></table>'
    + '<table><tr><th>' + h(TP('equipment')) + '</th><th style="width:60pt;text-align:center">' + h(TP('present')) + '</th><th style="width:60pt;text-align:center">' + h(TP('qty')) + '</th></tr>' + rows + '</table>'
    + '<table><tr><th>' + h(TP('obs')) + '</th></tr><tr><td style="white-space:pre-wrap">' + h(it.observations || TP('none')) + '</td></tr></table>'
    + '<div class="sigs"><div>' + h(TP('sig_taker', { t: it.taker })) + '<br>' + h(it.taker_signer) + '<img src="' + it.taker_signature_png + '" alt=""></div>'
    + '<div>SAF Hélicoptères<br>' + h(it.saf_signer) + '<img src="' + it.saf_signature_png + '" alt=""></div></div>';
}

/* file d'attente hors ligne */
let pvSyncing = false;
async function syncPv(){
  if(pvSyncing) return; pvSyncing = true;
  for(const it of LS.get(K_PV.queue, [])){
    if(it.err && !it.force) continue;
    try{ await smsRpc('fleet_handover_submit', { p: it.p }); LS.set(K_PV.queue, LS.get(K_PV.queue, []).filter(x => x.p.ref !== it.p.ref)); }
    catch(e){ if(!e.server) break; const q = LS.get(K_PV.queue, []), x = q.find(y => y.p.ref === it.p.ref); if(x){ x.err = e.message; x.force = false; x.tries++; LS.set(K_PV.queue, q); } }
  }
  pvSyncing = false; pvRenderQueue(); renderBadges();
}
window.addEventListener('online', syncPv);
setInterval(() => { if(navigator.onLine && LS.get(K_PV.queue, []).some(x => !x.err)) syncPv(); }, 60000);
$('p-sync').onclick = async () => { const q = LS.get(K_PV.queue, []); q.forEach(x => { x.force = true; }); LS.set(K_PV.queue, q); await syncPv(); };
function pvRenderQueue(){
  const q = LS.get(K_PV.queue, []);
  $('p-queue-wrap').classList.toggle('hide', !q.length);
  $('p-queue').innerHTML = q.map(x => '<div class="qrow"><span>' + h(x.p.reg) + ' <em>· ' + h(x.p.taker) + '</em>' + (x.err ? '<br><span class="e">' + h(pvErr(x.err)) + '</span>' : '') + '</span><em>' + h(x.p.event_date.split('-').reverse().join('/')) + '</em></div>').join('');
}
function pvBadge(){ const n = LS.get(K_PV.queue, []).length; $('pv-badge').innerHTML = n ? '<span class="badge q">' + h(TP('queue_badge', { n })) + '</span>' : ''; }
pvDrawItems(); pvNow(); $('p-signer2').value = LS.get(K_PV.signer, '') || '';

  const m = LS.get(K.mission, null); if(m){ $('t-mref').value = m.mission_ref || ''; $('t-site').value = m.site || ''; }
  { const b = LS.get(K.briefer, null); if(b && !b.id){ try{ localStorage.removeItem(K.briefer); }catch(e){} } }
  applyLang(); route(); loadTrainers();
  /* session documentation déjà ouverte (même navigateur que le portail) : badge « À lire » */
  const c = smsClient(); if(c) c.auth.getSession().then(r => { if(r.data && r.data.session && !DOCS.ready) docsLoad(); });
})();
