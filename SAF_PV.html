<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PV prise en charge / restitution – SAF International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f8;--panel:#fff;--panel2:#f5f8fb;--ink:#0a2238;--ink2:#4a6178;--line:#d3dfea;--band:#0b2a4a;--pv:#5a4a8c;--ok:#1d7a4c;--warn:#8a5a00;--err:#b42318;--gold:#c99a1f;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b1320;--panel:#121d2d;--panel2:#18263a;--ink:#e8f0f8;--ink2:#9fb2c6;--line:#263a51;--band:#081a30;--pv:#9a88d6;--ok:#5cc58f;--warn:#f0b84a;--err:#ff7a6b;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hide{display:none!important}
header{position:sticky;top:0;z-index:10;background:var(--band);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:14px}
header a.back{color:#cfe0f2;text-decoration:none;font-weight:600;white-space:nowrap}
header img{height:30px;width:auto}
header h1{margin:0;font-family:var(--cond);font-size:21px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .who{font-size:13px;color:#cfe0f2;white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h2{font-family:var(--cond);font-size:23px;margin:22px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:4px solid var(--line)}
.card.out{border-top-color:var(--pv)} .card.home{border-top-color:var(--ok)}
.card .reg{font-family:var(--cond);font-size:26px;font-weight:700;line-height:1}
.card .sub{color:var(--ink2);font-size:14px;margin-top:2px}
.card .st{margin-top:10px;font-weight:600}
.card .st small{display:block;font-weight:400;color:var(--ink2)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 12px}
.tools select,.tools input{min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 12px}
.tools input{flex:1;min-width:180px}
.btn{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);padding:8px 16px;font-weight:600;cursor:pointer}
.btn.main{background:var(--pv);border-color:var(--pv);color:#fff}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table.list{width:100%;border-collapse:collapse;min-width:680px}
table.list th{text-align:left;font-size:13px;color:var(--ink2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
table.list td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover{background:var(--panel2)}
.tag{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid}
.tag.pickup{color:var(--pv);border-color:var(--pv)}
.tag.return{color:var(--ok);border-color:var(--ok)}
.tag.dmg{color:var(--err);border-color:var(--err)}
.muted{color:var(--ink2)}
.empty{padding:28px;text-align:center;color:var(--ink2)}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:560px;margin:40px auto;text-align:center}
.msg a{color:var(--pv);font-weight:600}
/* fiche */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(5,15,30,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:24px 12px}
.sheet>div{background:var(--panel);color:var(--ink);border-radius:16px;max-width:820px;width:100%;padding:22px;position:relative}
.sheet h3{font-family:var(--cond);font-size:27px;margin:0 0 2px;line-height:1.1}
.sheet .x{position:absolute;right:12px;top:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 18px;margin:14px 0}
.kv div{border-bottom:1px solid var(--line);padding:4px 0}
.kv b{display:block;font-size:12.5px;color:var(--ink2);font-weight:600}
table.eq{width:100%;border-collapse:collapse;margin:8px 0 4px}
table.eq th,table.eq td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
table.eq th{font-size:13px;color:var(--ink2)}
table.eq td.c,table.eq th.c{text-align:center;width:90px}
.diff-miss{color:var(--err);font-weight:600} .diff-more{color:var(--warn);font-weight:600}
.cmp{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0}
.cmp h4{margin:0 0 6px;font-size:16px}
.obs{white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:10px 12px}
.obs.dmg{border-left:4px solid var(--err)}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.sigs img{display:block;width:100%;height:120px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:4px}
.btn.danger{color:var(--err);border-color:var(--err);margin-right:auto}
.del{background:var(--panel2);border:1.5px solid var(--err);border-radius:12px;padding:14px;margin-top:16px}
.del textarea{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);font:inherit;color:inherit;margin:6px 0}
.del .err{color:var(--err);font-size:14px;margin:4px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--band);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;z-index:40}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@media (max-width:560px){.sigs{grid-template-columns:1fr} header .who{display:none}}
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  header,main,.sheet{display:none!important}
  #print{display:block;font-family:var(--sans);font-size:10.5pt;color:#000}
  #print h1{font-size:18pt;margin:0 0 4pt}
  #print table{width:100%;border-collapse:collapse;margin:7pt 0}
  #print td,#print th{border:1px solid #888;padding:3pt 5pt;text-align:left;vertical-align:top}
  #print .sigs{display:grid;grid-template-columns:1fr 1fr;gap:12pt}
  #print .sigs img{width:100%;height:85pt;object-fit:contain;border:1px solid #888}
}
</style>
</head>

const FLEET = [ { reg:'HB-ZKN', type:'AS 332 C1', msn:'9010' }, { reg:'HB-ZIP', type:'AS 332 C1e', msn:'2864' }, { reg:'F-HRTS', type:'AS 332 C1e', msn:'3017' } ];
const LIST_COLS = 'id,ref,movement,taker,reg,aircraft_type,msn,event_date,event_time,order_no,equipment,observations,major_damage,taker_signer,saf_signer,submitted_at';
const $ = id => document.getElementById(id);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd = iso => iso ? iso.split('-').reverse().join('/') : '';
const ft = t => t ? String(t).slice(0,5) : '';
const MV = { pickup:'Prise en charge', return:'Restitution' };
let sb = null, ALL = [], CAN_DEL = false;

function gate(html){ $('gate').innerHTML = html; $('gate').classList.remove('hide'); $('content').classList.add('hide'); }
async function start(){
  if(!window.supabase){ gate('Le module de connexion n’a pas pu se charger. Vérifiez la connexion Internet puis rechargez la page.'); return; }
  sb = window.supabase.createClient(SB_URL, SB_ANON, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } });
  const { data } = await sb.auth.getSession();
  if(!data || !data.session){ gate('<p>Connectez-vous d’abord sur le portail SAF International, puis revenez sur cette page.</p><p><a href="./">Aller au portail</a></p>'); return; }
  $('who').textContent = data.session.user.email || '';
  { const r = await sb.rpc('fleet_handover_can_delete'); CAN_DEL = !r.error && r.data === true; }
  await load();
}
async function load(){
  $('reload').disabled = true;
  const { data, error } = await sb.from('fleet_handovers').select(LIST_COLS).order('event_date', { ascending:false }).order('event_time', { ascending:false }).limit(1000);
  $('reload').disabled = false;
  if(error){ gate('<p>Lecture impossible : ' + h(error.message) + '</p><p><a href="./">Retour au portail</a></p>'); return; }
  ALL = data || [];
  $('gate').classList.add('hide'); $('content').classList.remove('hide');
  drawCards(); drawRegs(); drawRows();
}
function chrono(a, b){ return (a.event_date + a.event_time).localeCompare(b.event_date + b.event_time); }
function drawCards(){
  $('cards').innerHTML = FLEET.map(a => {
    const pv = ALL.filter(x => x.reg === a.reg).sort(chrono), last = pv[pv.length - 1];
    let cls = '', st = '<span class="muted">Aucun PV enregistré</span>';
    if(last && last.movement === 'pickup'){ cls = 'out'; st = 'Chez ' + h(last.taker) + '<small>depuis le ' + fd(last.event_date) + ' à ' + ft(last.event_time) + '</small>'; }
    else if(last){ cls = 'home'; st = 'Restitué par ' + h(last.taker) + '<small>le ' + fd(last.event_date) + ' à ' + ft(last.event_time) + '</small>'; }
    return '<div class="card ' + cls + '"><div class="reg">' + a.reg + '</div><div class="sub">' + a.type + ' · MSN ' + a.msn + ' · ' + pv.length + ' PV</div><div class="st">' + st + '</div></div>';
  }).join('');
}
function drawRegs(){
  const cur = $('f-reg').value;
  $('f-reg').innerHTML = '<option value="">Tous les appareils</option>' + FLEET.map(a => '<option>' + a.reg + '</option>').join('');
  $('f-reg').value = cur;
}
function filtered(){
  const r = $('f-reg').value, m = $('f-mvt').value, d = $('f-dmg').checked, q = $('f-q').value.trim().toLowerCase();
  return ALL.filter(x => (!r || x.reg === r) && (!m || x.movement === m) && (!d || x.major_damage)
    && (!q || [x.taker, x.order_no, x.ref, x.taker_signer, x.saf_signer, x.observations].join(' ').toLowerCase().includes(q)));
}
function eqSummary(x){ const p = (x.equipment || []).filter(e => e.present); return p.length ? p.length + ' élément' + (p.length > 1 ? 's' : '') : '<span class="muted">aucun coché</span>'; }
function drawRows(){
  const rows = filtered();
  $('rows').innerHTML = rows.length ? rows.map(x => '<tr data-id="' + x.id + '" tabindex="0"><td>' + fd(x.event_date) + '<br><span class="muted">' + ft(x.event_time) + '</span></td><td><b>' + h(x.reg) + '</b><br><span class="muted">' + h(x.aircraft_type) + '</span></td>'
    + '<td><span class="tag ' + x.movement + '">' + MV[x.movement] + '</span></td><td>' + h(x.taker) + (x.order_no ? '<br><span class="muted">Cde ' + h(x.order_no) + '</span>' : '') + '</td>'
    + '<td>' + eqSummary(x) + '</td><td>' + (x.major_damage ? '<span class="tag dmg">Dégât signalé</span>' : '<span class="muted">RAS</span>') + '</td><td class="muted" style="font-size:13px">' + h(x.ref) + '</td></tr>').join('')
    : '<tr><td colspan="7" class="empty">' + (ALL.length ? 'Aucun PV ne correspond aux filtres.' : 'Aucun PV reçu pour l’instant. Ils arrivent ici dès qu’un PV est enregistré dans SAF Mobile.') + '</td></tr>';
  $('count').textContent = ALL.length ? rows.length + ' PV affiché' + (rows.length > 1 ? 's' : '') + ' sur ' + ALL.length : '';
  document.querySelectorAll('#rows tr[data-id]').forEach(tr => { tr.onclick = () => openPv(tr.dataset.id); tr.onkeydown = e => { if(e.key === 'Enter') openPv(tr.dataset.id); }; });
}
['f-reg','f-mvt','f-dmg'].forEach(id => $(id).addEventListener('change', drawRows));
$('f-q').addEventListener('input', drawRows);
$('reload').onclick = load;

/* Comparaison : une restitution est comparée à la prise en charge précédente du même appareil, et inversement */
function previousOpposite(x){
  const before = ALL.filter(y => y.reg === x.reg && y.id !== x.id && chrono(y, x) < 0).sort(chrono);
  for(let i = before.length - 1; i >= 0; i--) if(before[i].movement !== x.movement) return before[i];
  return null;
}
function compare(x, prev){
  if(!prev) return '';
  const pm = {}; (prev.equipment || []).forEach(e => { pm[e.id] = e; });
  const lines = (x.equipment || []).map(e => { const a = pm[e.id] ? (pm[e.id].n || 0) : 0, b = e.n || 0; return { label:e.label, a, b }; }).filter(l => l.a !== l.b);
  const head = 'Comparaison avec la ' + MV[prev.movement].toLowerCase() + ' du ' + fd(prev.event_date) + ' (' + h(prev.taker) + ')';
  if(!lines.length) return '<div class="cmp"><h4>' + head + '</h4>Matériel identique : aucune différence de nombre.</div>';
  return '<div class="cmp"><h4>' + head + '</h4><table class="eq"><tr><th>Élément</th><th class="c">Avant</th><th class="c">Maintenant</th><th class="c">Écart</th></tr>'
    + lines.map(l => '<tr><td>' + h(l.label) + '</td><td class="c">' + l.a + '</td><td class="c">' + l.b + '</td><td class="c ' + (l.b < l.a ? 'diff-miss' : 'diff-more') + '">' + (l.b > l.a ? '+' : '') + (l.b - l.a) + '</td></tr>').join('') + '</table></div>';
}
async function openPv(id){
  const x = ALL.find(y => y.id === id); if(!x) return;
  const box = $('sheet-box');
  box.innerHTML = '<p class="muted">Chargement des signatures…</p>'; $('sheet').classList.remove('hide');
  const { data } = await sb.from('fleet_handovers').select('taker_signature_png,saf_signature_png').eq('id', id).single();
  const sig = data || {};
  const eqRows = (x.equipment || []).map(e => '<tr><td>' + h(e.label) + '</td><td class="c">' + (e.present ? '✓' : '—') + '</td><td class="c">' + (e.n || '') + '</td></tr>').join('');
  box.innerHTML = '<button class="btn x" type="button" id="s-close" aria-label="Fermer">✕</button>'
    + '<h3 id="s-title">' + MV[x.movement] + ' · ' + h(x.reg) + '</h3><div class="muted">' + h(x.ref) + '</div>'
    + '<div class="kv"><div><b>Preneur</b>' + h(x.taker) + '</div><div><b>Date et heure</b>' + fd(x.event_date) + ' à ' + ft(x.event_time) + '</div>'
    + '<div><b>Appareil</b>' + h(x.reg) + ' · ' + h(x.aircraft_type) + '</div><div><b>N° de série</b>' + h(x.msn) + '</div>'
    + '<div><b>N° de commande d’exécution</b>' + h(x.order_no || '—') + '</div><div><b>Reçu le</b>' + new Date(x.submitted_at).toLocaleString('fr-FR') + '</div></div>'
    + compare(x, previousOpposite(x))
    + '<h4 style="margin:16px 0 4px">Matériel à bord</h4><table class="eq"><tr><th>Élément</th><th class="c">Présent</th><th class="c">Nombre</th></tr>' + eqRows + '</table>'
    + '<h4 style="margin:16px 0 6px">Observations (dégât majeur constaté)</h4><div class="obs' + (x.major_damage ? ' dmg' : '') + '">' + h(x.observations || 'Rien à signaler') + '</div>'
    + '<div class="sigs"><div><b>Preneur : ' + h(x.taker) + '</b><br>' + h(x.taker_signer) + (sig.taker_signature_png ? '<img src="' + sig.taker_signature_png + '" alt="Signature du preneur">' : '') + '</div>'
    + '<div><b>SAF Hélicoptères</b><br>' + h(x.saf_signer) + (sig.saf_signature_png ? '<img src="' + sig.saf_signature_png + '" alt="Signature SAF">' : '') + '</div></div>'
    + '<div id="s-del-box"></div>'
    + '<div class="acts">' + (CAN_DEL ? '<button class="btn danger" type="button" id="s-del">Supprimer ce PV</button>' : '') + '<button class="btn" type="button" id="s-close2">Fermer</button><button class="btn main" type="button" id="s-print">Imprimer / PDF</button></div>';
  $('s-close').onclick = $('s-close2').onclick = closePv;
  $('s-print').onclick = () => { buildPrint(x, sig, eqRows); window.print(); };
  if(CAN_DEL) $('s-del').onclick = () => askDelete(x);
  $('s-close').focus();
}
/* Suppression (admins) : motif obligatoire, le PV est archivé dans fleet_handovers_deleted */
function askDelete(x){
  $('s-del').disabled = true;
  $('s-del-box').innerHTML = '<div class="del"><b>Supprimer le PV ' + h(x.ref) + ' ?</b><br><span class="muted">Il disparaît de la liste. Une copie est archivée avec votre nom, la date et le motif.</span>'
    + '<textarea id="d-reason" maxlength="500" placeholder="Motif de la suppression (obligatoire), par ex. PV de test, doublon, erreur d’appareil"></textarea>'
    + '<div class="acts" style="margin-top:6px"><button class="btn" type="button" id="d-cancel">Annuler</button><button class="btn main" type="button" id="d-ok" style="background:var(--err);border-color:var(--err)">Supprimer définitivement</button></div><p class="err" id="d-err"></p></div>';
  $('d-reason').focus();
  $('d-cancel').onclick = () => { $('s-del-box').innerHTML = ''; $('s-del').disabled = false; };
  $('d-ok').onclick = async () => {
    const reason = $('d-reason').value.trim();
    if(reason.length < 3){ $('d-err').textContent = 'Indiquez le motif de la suppression.'; $('d-reason').focus(); return; }
    $('d-ok').disabled = true; $('d-err').textContent = '';
    const { error } = await sb.rpc('fleet_handover_delete', { p_id: x.id, p_reason: reason });
    if(error){ $('d-ok').disabled = false; $('d-err').textContent = /not_allowed/.test(error.message) ? 'Suppression réservée aux administrateurs.' : 'Suppression impossible : ' + error.message; return; }
    ALL = ALL.filter(y => y.id !== x.id); closePv(); drawCards(); drawRows(); toast('PV ' + x.ref + ' supprimé');
  };
}
function toast(msg){ const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role','status'); d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }
function closePv(){ $('sheet').classList.add('hide'); }
$('sheet').addEventListener('click', e => { if(e.target.id === 'sheet') closePv(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closePv(); });
function buildPrint(x, sig, eqRows){
  $('print').innerHTML = '<img src="' + LOGO_L + '" alt="" style="height:42pt;float:right">'
    + '<h1>PV de ' + (x.movement === 'pickup' ? 'prise en charge' : 'restitution') + ' de l’appareil</h1><p>' + h(x.ref) + '</p>'
    + '<table><tr><th>Preneur</th><td colspan="3">' + h(x.taker) + '</td></tr><tr><th>Immatriculation</th><td>' + h(x.reg) + '</td><th>N° de série</th><td>' + h(x.msn) + '</td></tr>'
    + '<tr><th>Type</th><td>' + h(x.aircraft_type) + '</td><th>Date</th><td>' + fd(x.event_date) + ' · ' + ft(x.event_time) + '</td></tr><tr><th>N° de commande</th><td colspan="3">' + h(x.order_no || '—') + '</td></tr></table>'
    + '<table><tr><th>Élément</th><th>Présent</th><th>Nombre</th></tr>' + eqRows + '</table>'
    + '<table><tr><th>Observations (dégât majeur constaté)</th></tr><tr><td style="white-space:pre-wrap">' + h(x.observations || 'Rien à signaler') + '</td></tr></table>'
    + '<div class="sigs"><div>Preneur : ' + h(x.taker) + '<br>' + h(x.taker_signer) + (sig.taker_signature_png ? '<img src="' + sig.taker_signature_png + '" alt="">' : '') + '</div>'
    + '<div>SAF Hélicoptères<br>' + h(x.saf_signer) + (sig.saf_signature_png ? '<img src="' + sig.saf_signature_png + '" alt="">' : '') + '</div></div>';
}
start();
</script>
</body>
